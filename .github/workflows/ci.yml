name: ⚙️ CI
on:
  push:
    # branches: [ master ]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "**/*.png"
      - "**/*.svg"

  pull_request:
    # branches: [ master ]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "**/*.png"
      - "**/*.svg"

jobs:
  unit-tests-godot-4-2:
    name: "⚙️ Unit tests - Godot 4.2.1"
    uses: ./.github/workflows/unit_tests.yml
    with:
      repo-ref: ${{ github.ref }}
      godot-version: 4.2.1-stable
      gut-tag: v9.3.0
  unit-tests-godot-4-4:
    name: "⚙️ Unit tests - Godot 4.4.1"
    uses: ./.github/workflows/unit_tests.yml
    with:
      repo-ref: ${{ github.ref }}
      godot-version: 4.4.1-stable
      gut-tag: v9.4.0
  unit-tests-godot-4-5:
    name: "⚙️ Unit tests - Godot 4.5"
    uses: ./.github/workflows/unit_tests.yml
    with:
      repo-ref: ${{ github.ref }}
      godot-version: 4.5-stable
      gut-tag: v9.5.0
  unit-tests-godot-4-6:
    name: "⚙️ Unit tests - Godot 4.6.3"
    uses: ./.github/workflows/unit_tests.yml
    with:
      repo-ref: ${{ github.ref }}
      godot-version: 4.6.3-stable
      gut-tag: v9.6.1
  unit-tests-godot-4-7:
    name: "⚙️ Unit tests - Godot 4.7.1"
    uses: ./.github/workflows/unit_tests.yml
    with:
      repo-ref: ${{ github.ref }}
      godot-version: 4.7.1-stable
      gut-tag: v9.7.1

  package:
    name: "📦 Package for Asset Store"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create package
      # Strip all non-plugin files and move readme and license into the plugin dir
        run: |
          mkdir -p package/addons
          mv addons/diagnosticlist package/addons
          mv README.md LICENSE package/addons/diagnosticlist

      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@v2

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.ghd.outputs.describe }}
          path: package
